# Prometheus 04-prometheus-pairing — scrape config.
# Fleet job names and ports: prometheus :9090, windows_exporter :9182.
# For a STANDALONE/DEV Prometheus only — never the fleet's config.
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: windows_exporter
    static_configs:
      - targets: ["localhost:9182"]
